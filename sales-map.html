<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0b"><title>START RIGHT 営業MAP</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans",sans-serif}header{position:sticky;top:0;z-index:1000;background:rgba(11,11,11,.94);backdrop-filter:blur(14px);border-bottom:1px solid #282828;padding:14px 16px}.logo{font-weight:900;letter-spacing:.08em}.sub{font-size:11px;color:#999;margin-top:2px}.wrap{max-width:1100px;margin:auto;padding:14px}.card{background:#151515;border:1px solid #292929;border-radius:18px;padding:16px;margin-bottom:12px}h2{margin:0 0 10px;font-size:20px}input,textarea{width:100%;background:#0d0d0d;color:#fff;border:1px solid #3a3a3a;border-radius:12px;padding:13px;margin:5px 0;font-size:16px}button{background:#fff;color:#000;border:0;border-radius:12px;padding:12px 15px;font-weight:800;font-size:14px;margin:4px 4px 4px 0}.muted{color:#aaa;font-size:13px;line-height:1.5}.hidden{display:none}.row{display:flex;gap:7px;flex-wrap:wrap}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{display:inline-block;border:1px solid #444;padding:5px 9px;border-radius:999px;font-size:12px}.req{border-top:1px solid #2a2a2a;padding:12px 0}#map{height:68vh;min-height:460px;border-radius:15px;overflow:hidden}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#111;color:#fff}.stats{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.stat{background:#202020;border-radius:999px;padding:7px 10px;font-size:12px}.error{color:#ff9a9a}.pending{color:#ffd778}@media(max-width:600px){.wrap{padding:10px}.card{border-radius:15px}#map{height:72vh;min-height:420px}}</style></head><body><header><div class="logo">START RIGHT</div><div class="sub">SALES MAP / APPROVAL ONLY</div></header><main class="wrap"><section id="auth" class="card"><h2>営業MAP ログイン</h2><p class="muted">URLを知っているだけでは閲覧できません。START RIGHTの承認が必要です。</p><input id="email" type="email" autocomplete="email" placeholder="メールアドレス"><input id="pass" type="password" autocomplete="current-password" placeholder="パスワード（6文字以上）"><div class="row"><button id="loginBtn">ログイン</button><button id="signupBtn">アカウント作成</button></div><div id="authmsg" class="muted"></div></section><section id="access" class="card hidden"><div class="top"><div><h2>アクセス状態</h2><div id="state" class="muted"></div></div><button id="logoutBtn">ログアウト</button></div><div id="requestbox" class="hidden"><textarea id="reason" placeholder="利用目的（例：ステッカー配布営業）"></textarea><button id="requestBtn">START RIGHTへ閲覧申請</button></div></section><section id="admin" class="card hidden"><h2>START RIGHT 承認管理</h2><div id="requests" class="muted">読み込み中…</div></section><section id="mapcard" class="card hidden"><div class="top"><div><h2>営業MAP</h2><div id="count" class="muted"></div></div><button id="refreshBtn">更新</button></div><div class="stats"><span class="stat">常温優先</span><span class="stat">再配達なし</span><span class="stat">承認制</span></div><div id="map"></div></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const API='https://mwrkyjbjjfelccgjkyop.supabase.co/functions/v1/sales-map-api',TENANT='94f1414b-779d-4422-b3aa-a228d3b3d228';let token=localStorage.getItem('sr_sales_map_token')||'',map,layer;const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function call(action,body={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json',...(token?{'authorization':'Bearer '+token}:{})},body:JSON.stringify({action,...body})});const d=await r.json().catch(()=>({error:'invalid_response'}));if(!r.ok)throw new Error(d.msg||d.message||d.error_description||d.error||('HTTP '+r.status));return d}async function login(){try{$('authmsg').textContent='ログイン中…';const d=await call('login',{email:$('email').value,password:$('pass').value});token=d.access_token||'';if(!token)throw new Error(d.msg||d.error_description||'ログインできませんでした');localStorage.setItem('sr_sales_map_token',token);$('authmsg').textContent='';await boot()}catch(e){$('authmsg').innerHTML='<span class="error">'+esc(e.message)+'</span>'}}async function signup(){try{$('authmsg').textContent='登録中…';const d=await call('signup',{email:$('email').value,password:$('pass').value});if(d.access_token){token=d.access_token;localStorage.setItem('sr_sales_map_token',token);await boot()}else $('authmsg').textContent='確認メールを送信しました。確認後にログインしてください。'}catch(e){$('authmsg').innerHTML='<span class="error">'+esc(e.message)+'</span>'}}function logout(){localStorage.removeItem('sr_sales_map_token');token='';location.reload()}async function boot(){if(!token)return;$('auth').classList.add('hidden');$('access').classList.remove('hidden');try{let s=await call('state',{tenant_id:TENANT});let x=Array.isArray(s)?s[0]:s;let st=x?.status||'none';$('state').innerHTML='状態: <span class="pill">'+esc(st)+'</span>'+(x?.expires_at?' / 期限 '+new Date(x.expires_at).toLocaleString('ja-JP'):'');$('requestbox').classList.toggle('hidden',!['none','rejected','revoked'].includes(st));if(st==='pending')$('state').innerHTML+=' <span class="pending">START RIGHT承認待ち</span>';if(st==='approved'){$('mapcard').classList.remove('hidden');await loadMap()}if(x?.is_admin){$('admin').classList.remove('hidden');await loadRequests()}}catch(e){$('state').innerHTML='<span class="error">認証エラー: '+esc(e.message)+'</span>';localStorage.removeItem('sr_sales_map_token')}}async function requestAccess(){try{await call('request',{tenant_id:TENANT,reason:$('reason').value||'営業MAP利用'});await boot()}catch(e){alert(e.message)}}async function loadRequests(){try{const xs=await call('list_requests',{tenant_id:TENANT});$('requests').innerHTML=(xs||[]).map(x=>'<div class="req"><b>'+esc(x.email||x.user_id)+'</b> <span class="pill">'+esc(x.status)+'</span><div class="muted">'+esc(x.reason||'理由なし')+' / '+new Date(x.requested_at).toLocaleString('ja-JP')+'</div><div><button onclick="review(\''+x.id+'\',\'approved\')">承認</button><button onclick="review(\''+x.id+'\',\'rejected\')">拒否</button><button onclick="review(\''+x.id+'\',\'revoked\')">取消</button></div></div>').join('')||'申請なし'}catch(e){$('requests').innerHTML='<span class="error">'+esc(e.message)+'</span>'}}async function review(id,decision){try{await call('review',{request_id:id,decision});await loadRequests()}catch(e){alert(e.message)}}async function loadMap(){try{const pts=await call('points',{tenant_id:TENANT});$('count').textContent=(pts?.length||0)+'件';if(!map){map=L.map('map',{zoomControl:true}).setView([43.0618,141.3545],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);layer=L.layerGroup().addTo(map)}layer.clearLayers();const bounds=[];(pts||[]).forEach(p=>{const planned=p.visit_status==='planned',ready=String(p.visit_status||'').includes('READY');const m=L.circleMarker([p.latitude,p.longitude],{radius:planned?7:5,color:planned?'#111':ready?'#333':'#666',fillColor:planned?'#fff':ready?'#ddd':'#999',fillOpacity:.95,weight:2}).bindPopup('<b>#'+(p.route_order??'-')+' '+esc(p.company_name||'')+'</b><br>'+esc(p.address_text||'')+'<br><small>'+esc(p.area||'')+' / '+esc(p.visit_status||'')+'</small>');m.addTo(layer);bounds.push([p.latitude,p.longitude])});if(bounds.length)map.fitBounds(bounds,{padding:[20,20]});setTimeout(()=>map.invalidateSize(),100)}catch(e){$('count').innerHTML='<span class="error">MAP取得不可: '+esc(e.message)+'</span>'}}$('loginBtn').onclick=login;$('signupBtn').onclick=signup;$('logoutBtn').onclick=logout;$('requestBtn').onclick=requestAccess;$('refreshBtn').onclick=loadMap;if(token)boot();</script></body></html>
